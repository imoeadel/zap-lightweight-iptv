plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The published APK is signed with a key kept outside the repo. Without keystore.properties, builds use the debug key.
def signingFile = rootProject.file('keystore.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.moe.zap'
    compileSdk 34

    defaultConfig {
        applicationId 'com.moe.zap'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '1.2.2'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        resConfigs 'en', 'ar', 'xhdpi'
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures { buildConfig false }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module', 'kotlin/**', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-datasource-okhttp:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
}
